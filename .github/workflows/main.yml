name: 抽卡TDD自动化测试
on:
  push:
    branches: [ develop ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装Python3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: 安装依赖
        run: |
          pip install pytest flake8

      - name: 代码检查
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 运行测试
        run: |
          pytest test_business_logic.py -v
